name: Publish to PyPI

# Publishing a GitHub release (tag vX.Y.Z) tests and builds the package and uploads
# it with Trusted Publishing: no API token is stored anywhere, and PyPI records a
# signed provenance attestation for each file linking it to this repository and
# workflow run.  A release marked "pre-release" on GitHub goes to TestPyPI instead.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the release tag matches the package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/bloomsieve/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match __version__ $version (expected v$version)"
            exit 1
          fi
      - name: Lint and unit tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,redis]"
          ruff check .
          pytest -q
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          rm -rf dist
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    # Must match the environment name configured for the trusted publisher on PyPI
    environment:
      name: pypi
      url: https://pypi.org/project/bloomsieve/
    permissions:
      id-token: write  # lets PyPI verify this workflow (Trusted Publishing) and sign attestations
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload with provenance attestations
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  publish-testpypi:
    name: Upload to TestPyPI
    needs: build
    if: ${{ github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    # Must match the environment name configured for the trusted publisher on TestPyPI
    environment:
      name: testpypi
      url: https://test.pypi.org/project/bloomsieve/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload with provenance attestations
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
