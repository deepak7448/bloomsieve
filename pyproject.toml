[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bloomsieve"
dynamic = ["version"]
description = "A clean, high-performance, standalone Python Bloom Filter package with local memory-mapped file caching and RedisBloom support."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Deepak prajapati", email = "prajapatideepak244@gmail.com" }
]
keywords = ["bloom-filter", "redis", "redisbloom", "mmap", "cache", "probabilistic-data-structure"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "redis>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/example/bloomsieve"
Repository = "https://github.com/example/bloomsieve"
Issues = "https://github.com/example/bloomsieve/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bloomsieve"]

[tool.hatch.version]
path = "src/bloomsieve/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=src/bloomsieve --cov-report=term-missing"
